<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Everlasting: Infinite Hallways</title>
    <style>
      :root {
        --bg: #0b0f12;
        --ink: #eef3e6;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -webkit-font-smoothing: none;
        touch-action: none;
        outline: none;
      }
      #boot-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px/1.5 ui-monospace, monospace;
        color: #a9c4a0;
        background: #0b0f12;
        z-index: 10;
        text-align: center;
        padding: 24px;
      }
      #boot-status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-status">Unlocking the hallway&hellip;</div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
